name: cellrank-pancreas-velocity
channels:
  - conda-forge
dependencies:
  - python=3.10.11
  - pip
  - pip:
      # Core analysis stack
      - numpy==2.2.5
      - pandas==2.2.3
      - scipy==1.15.3
      - anndata==0.11.4
      - scanpy==1.11.5
      - scvelo==0.3.4
      - cellrank==2.0.7
      - decoupler==2.1.4
      - matplotlib==3.10.3

      # Key dependencies actually exercised by the notebooks
      - scikit-learn==1.6.1    # PCA / neighbor graph (scanpy)
      - numba==0.65.0          # JIT-compiled moments / velocity kernels (scvelo, cellrank)
      - h5py==3.16.0           # .h5ad read/write
      - pygam==0.12.0          # cellrank.models.GAM (gene-trend plots, notebook 2)
      - statsmodels==0.14.6    # decoupler dependency
      - requests==2.34.2       # CollecTRI / HCOP network downloads (notebook 3)

      # To run the notebooks themselves
      - jupyter==1.1.1
      - nbformat==5.11.1
      - nbconvert==7.17.1
      - ipykernel==7.3.0
